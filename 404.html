<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- GitHub Pages serves this page for any missing URL, so its links are absolute. -->
<title>Page not found · Gaspar Zimbrek-Turkovic</title>
<meta name="robots" content="noindex">
<link rel="icon" href="https://gasparzimbrek-arch.github.io/favicon.svg" type="image/svg+xml">
<style>
  :root{--ground:#FAFAF8; --ink:#1C2128; --muted:#5B626C; --rule:#E2E3DF; --accent:#264A6E}
  @media (prefers-color-scheme: dark){
    :root{--ground:#15181C; --ink:#E7E8E6; --muted:#A3A9B1; --rule:#2A2F35; --accent:#9DB9D8}
  }
  *{box-sizing:border-box}
  body{background:var(--ground); color:var(--ink); font:16px/1.6 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin:0; padding-inline:24px}
  main{max-width:640px; margin-inline:auto; padding-block:72px 64px}
  .kicker{font-size:.75rem; font-weight:600; letter-spacing:.1em; color:var(--accent); margin:0 0 14px}
  h1{font-family:Georgia, "Times New Roman", serif; font-weight:500; font-size:2.25rem; line-height:1.15; margin:0}
  section{margin-top:32px; padding-top:20px; border-top:1px solid var(--rule)}
  p{margin:0 0 8px; color:var(--muted)}
  a{color:var(--accent); text-decoration:none; border-bottom:1px solid var(--rule)}
  a:hover{border-bottom-color:var(--accent)}
  @media (max-width:520px){ body{padding-inline:16px} main{padding-block:44px} h1{font-size:1.875rem} }
</style>
</head>
<body>
<main>
  <p class="kicker">404</p>
  <h1>Page not found<br><span lang="fr">Page introuvable</span></h1>

  <section>
    <p>This page doesn’t exist or has moved.</p>
    <a href="https://gasparzimbrek-arch.github.io/">Home</a>
  </section>

  <section lang="fr">
    <p>Cette page n’existe pas ou a été déplacée.</p>
    <a href="https://gasparzimbrek-arch.github.io/fr/">Accueil</a>
  </section>
</main>
</body>
</html>
